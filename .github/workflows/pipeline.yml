# Pipeline scheduler. See BUILD_BRIEF §2a.
#
# Vercel Cron was rejected: Hobby is once-per-day (±59min) with a 300s function
# cap. GitHub Actions gives 6h jobs and arbitrary schedules, and the web app on
# Vercel does no pipeline work — the two halves share only the Neon database.
#
# Two cadences, matching scripts/weekly.ts. The daily run finds and scores;
# the weekly run adds the digest. Discovery has to be daily because a feed holds
# a story for a day or two and a weekly pull silently misses whatever fell off.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
name: pipeline

on:
  schedule:
    # Anchored to the US working day, because that is where the sources are.
    # 06:15 UTC put the run at 2am ET, reading a day that had not happened yet:
    # EDGAR takes Form D filings through the US afternoon and a feed holds a
    # story a day or two, so the run consistently read them a day late.
    #
    # 22:00 UTC is 6pm ET / 3pm PT — after the US business day, and still the
    # SAME UTC calendar day as the news it reads. That second part is why not
    # 01:00 UTC: weeks here are Saturday-anchored UTC (lib/week.ts), so a run
    # past midnight UTC carries the next day's date and the Friday/Saturday
    # boundary would file a run under the wrong week. A late-afternoon filing
    # missed by an hour is recovered by the next run, since Form D is
    # date-addressable; a misfiled week is not.
    - cron: '0 22 * * *'
    # The digest send, Monday 12:00 UTC — 8am ET / 5am PT, ahead of the ET
    # working day. Sunday's 22:00 run renders the draft; this sends it. They
    # are separate jobs because the render belongs to the week it reports on
    # and the send belongs to the morning somebody reads it.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly, senddigest, resume, discover, score, assess, review, ambiguous, formd, portfolios, acra]
        # 'daily' is the pipeline; 'weekly' is the pipeline plus the digest.
      from:
        description: 'With mode=resume: the stage to restart from (e.g. score)'
        required: false
        type: string
      depth:
        description: 'Internal. How many times this run has already resumed.'
        required: false
        default: '0'
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    # Re-dispatching this workflow after a deadline stop is a write to Actions.
    # The default token is read-only for that, so it is asked for explicitly.
    permissions:
      contents: read
      actions: write
    # The LLM stages are rate-limited rather than slow, so they spend most of
    # their time backing off. Six hours is the ceiling a free runner allows.
    # GitHub kills a hosted job at six hours whatever this says, so 355 is the
    # most that can be asked for and still leave the runner a few minutes to
    # upload logs. The stage budgets in lib/stages.ts sum to less than this, so
    # a run that hits every timeout still reaches the digest rather than being
    # cut off partway with no summary.
    # The run stops itself at 290 minutes (scripts/weekly.ts --deadline), which
    # ends the job as `failure` and lets the resume step below fire. This is
    # only a backstop for a stage that hangs so hard the deadline check between
    # stages is never reached; GitHub kills a hosted job at 360 regardless, and
    # that kill lands as `cancelled`, where no step of ours would run.
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Every key, cycling gemini -> groq -> openrouter so no provider carries a
      # whole stage and no account is leaned on twice in a row. Each provider's
      # free tier is per ACCOUNT — Gemini per project, OpenRouter fifty model
      # requests a day — so a second key is a second allowance, not a retry.
      # The tail is uneven because the accounts are: gemini5's project answers
      # 403 PERMISSION_DENIED, so it is left out rather than given a slot that
      # fails every time the chain reaches it.
      # lib/budget.ts marks a key exhausted when its own cap reports, so a spent
      # one is skipped rather than retried.
      LLM_CHAIN: gemini,groq,openrouter,gemini2,groq2,openrouter2,gemini3,groq3,openrouter3,gemini4,groq4,openrouter4,groq5,openrouter5
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      GROQ_MODEL_SCORING: ${{ vars.GROQ_MODEL_SCORING || 'openai/gpt-oss-120b' }}
      GROQ_MODEL_DRAFTING: ${{ vars.GROQ_MODEL_DRAFTING || 'openai/gpt-oss-120b' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      # The one funded key uses a paid model; see lib/env.ts for why the free
      # alias left its balance untouched.
      OPENROUTER_MODEL_PAID: ${{ vars.OPENROUTER_MODEL_PAID || 'mistralai/mistral-nemo' }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_TEST_RECIPIENT: ${{ secrets.DIGEST_TEST_RECIPIENT }}
      # Where the digest goes, not whether it goes. 'true' confines every send
      # to DIGEST_TEST_RECIPIENT; set the repo variable to 'false' once
      # DIGEST_RECIPIENTS holds the real list.
      DIGEST_TEST_MODE: ${{ vars.DIGEST_TEST_MODE || 'true' }}
      DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
      # Resend's shared sender until a domain is verified; it can only deliver
      # to the account owner, which is consistent with test mode.
      DIGEST_FROM: ${{ vars.DIGEST_FROM || 'onboarding@resend.dev' }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'http://localhost:3111' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches the Node the scripts are developed against.
          node-version: '24'
          cache: npm
      - run: npm ci

      # Fail loudly and immediately on a missing credential rather than a
      # thousand lines into a stack trace. The workflow ran daily for a fortnight
      # failing in twenty seconds because DATABASE_URL was never set.
      - name: Check credentials
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$GEMINI_API_KEY$GROQ_API_KEY$OPENROUTER_API_KEY" ] && missing="$missing (no LLM key)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Set them with: gh secret set DATABASE_URL"
            exit 1
          fi

      # Two schedules land in this one workflow, so a scheduled run has to know
      # WHICH it is. The hour separates them: 22 is the nightly pipeline, 12 is
      # Monday's send. GitHub can fire a cron 5-15 min late but not into another
      # hour, and both crons sit on the hour, so the comparison holds.
      - id: dow
        name: Day of week (1=Monday, 7=Sunday) and UTC hour
        run: |
          echo "day=$(date -u +%u)" >> "$GITHUB_OUTPUT"
          echo "hour=$(date -u +%H)" >> "$GITHUB_OUTPUT"

      # ---- Form D, before the pipeline reads it ------------------------------
      #
      # Form D CREATES companies, and weekly.ts scores whatever exists when it
      # runs — so a filing found today has to be in the table before the
      # pipeline starts, or it waits a full day to be noticed. Filings are
      # published daily and a missed day is gone, so this is daily too.
      #
      # Every other news source — the wires, the trade press, Google News per
      # company, the ATS boards — is inside weekly.ts already. Only Form D,
      # the portfolio pages and ACRA sit outside it.
      - name: Form D ingestion
        if: >-
          ${{ github.event.inputs.mode == 'formd'
              || (github.event_name == 'schedule' && steps.dow.outputs.hour == '22') }}
        run: npx tsx scripts/ingest-formd.ts --days 3

      # ---- the pipeline ------------------------------------------------------
      #
      # Every stage in lib/stages.ts except the two marked weeklyOnly runs every
      # night: find, enrich, judge. The Sunday run adds the digest render, which
      # is the only difference between the two commands.
      #
      # Sunday rather than Monday because the digest reports on a FINISHED week.
      # Weeks close Friday (Saturday-anchored, lib/week.ts), so by Sunday 22:00
      # UTC the week is closed and scored, and render-digest.ts defaults to
      # lastWeekSaturday() — the week just ended. Rendering it Sunday and
      # sending Monday means the mail reflects a week nothing more will be added
      # to, rather than one still being written as it goes out.
      - name: Pipeline and digest render (Sundays)
        if: >-
          ${{ github.event.inputs.mode == 'weekly'
              || (github.event_name == 'schedule'
                  && steps.dow.outputs.hour == '22' && steps.dow.outputs.day == '7') }}
        run: npx tsx scripts/weekly.ts

      - name: Pipeline, no digest
        if: >-
          ${{ github.event.inputs.mode == 'daily'
              || (github.event_name == 'schedule'
                  && steps.dow.outputs.hour == '22' && steps.dow.outputs.day != '7') }}
        run: npx tsx scripts/weekly.ts --daily

      # ---- the send, Monday morning -----------------------------------------
      #
      # Its own scheduled run, holding nothing but the send. The draft was
      # written and saved by Sunday night's render; this approves it and sends.
      #
      # Approval is automatic here, which send-digest.ts deliberately does not
      # do by default — it keeps approve and send apart so somebody reads what
      # is about to leave. A scheduled send gives that up by definition. What
      # still stands between a draft and a stranger's inbox is DIGEST_TEST_MODE,
      # which confines every send to DIGEST_TEST_RECIPIENT until it is
      # explicitly false, and the digests row that records what went out.
      #
      # No --week on either command: both default to lastWeekSaturday(), and on
      # Monday 12:00 UTC that is the same week Sunday 22:00 UTC rendered.
      - name: Approve and send the weekly digest (Monday morning)
        if: >-
          ${{ github.event.inputs.mode == 'senddigest'
              || (github.event_name == 'schedule'
                  && steps.dow.outputs.hour == '12' && steps.dow.outputs.day == '1') }}
        run: |
          npx tsx scripts/send-digest.ts --approve
          npx tsx scripts/send-digest.ts --send

      # ---- single stages, for a manual run -----------------------------------
      # ---- did the run actually achieve anything? ---------------------------
      #
      # A stage can exit zero having done nothing, and a killed process cannot
      # write its own finish, so "the job went green" has never been the same
      # question as "the work happened". This asks the database instead: stages
      # that did not run, run rows left open, queues that did not drain.
      #
      # always(), so it reports after a failed run too — that is precisely when
      # the answer matters. It runs before the resume step so its output is in
      # the log a resume is decided from.
      - name: Check the pipeline actually progressed
        if: >-
          ${{ always() && steps.dow.outputs.hour != '12'
              && (github.event.inputs.mode == ''
                  || contains(fromJSON('["daily","weekly","resume"]'), github.event.inputs.mode)) }}
        run: |
          SCOPE=""
          if [ "${{ steps.dow.outputs.day }}" != "7" ]; then SCOPE="--daily"; fi
          npx tsx scripts/dev/health.ts $SCOPE

      # ---- picking up after a deadline stop ---------------------------------
      #
      # weekly.ts stops itself before the runner would be cancelled and exits
      # non-zero, so this fires. It asks the database which stage to resume
      # from rather than parsing logs, and re-dispatches this same workflow.
      #
      # The depth guard is what stops a genuinely broken pipeline dispatching
      # itself all night: three resumes is more than a slow day needs and far
      # short of a loop.
      - name: Resume automatically after a deadline stop
        # One guarded condition, not two ored together: `&&` binds tighter than
        # `||`, so a two-clause version fires on any failure whatever the depth,
        # which is how a crash-looping pipeline dispatches itself all night.
        #
        # Never on the 12:00 send job. Resuming means "restart the pipeline from
        # the stage it stopped at", which is the right answer for a run that
        # timed out mid-pipeline and a wrong one for a mail that failed to send:
        # that job ran no stages, so resume-point.ts would pick up whatever the
        # night before left and re-run it on a Monday morning.
        if: >-
          ${{ failure() && steps.dow.outputs.hour != '12'
              && fromJSON(github.event.inputs.depth || '0') < 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sunday's run includes the weekly-only stages; resuming it as daily
          # would skip them permanently, and the digest would never be rendered
          # for that week. 7 is Sunday under `date -u +%u`, matching the run
          # steps above.
          SCOPE=""
          if [ "${{ github.event.inputs.mode }}" = "daily" ] || [ "${{ steps.dow.outputs.day }}" != "7" ]; then
            SCOPE="--daily"
          fi
          NEXT=$(npx tsx scripts/dev/resume-point.ts $SCOPE 2>/dev/null | tail -1)
          if [ -z "$NEXT" ]; then
            echo "Every stage finished; nothing to resume."
            exit 0
          fi
          DEPTH=$(( ${{ github.event.inputs.depth || 0 }} + 1 ))
          echo "::notice::Resuming from $NEXT (attempt $DEPTH)"
          gh workflow run pipeline.yml \
            -f mode=resume -f from="$NEXT" -f depth="$DEPTH"

      # ---- resuming a run GitHub cut off -----------------------------------
      #
      # A hosted job is killed at six hours, and the stages that overrun are
      # always the same three. Every stage picks up only what it has not done —
      # the filter takes items still marked fetched, scoring takes companies
      # with no signal for the week, assessment takes companies with no
      # assessment at the current rubric — so restarting costs the time already
      # spent and nothing else. weekly.ts prints the exact command on failure.
      - name: Resume from a stage
        if: ${{ github.event.inputs.mode == 'resume' && github.event.inputs.from != '' }}
        run: npx tsx scripts/weekly.ts --from ${{ github.event.inputs.from }}

      - name: Discovery only
        if: ${{ github.event.inputs.mode == 'discover' }}
        run: |
          npx tsx scripts/ingest-context.ts
          npx tsx scripts/discover-news.ts

      - name: Scoring only
        if: ${{ github.event.inputs.mode == 'score' }}
        run: npx tsx scripts/score-companies.ts

      - name: Assessment only
        if: ${{ github.event.inputs.mode == 'assess' }}
        run: npx tsx scripts/assess-companies.ts

      - name: Dashboard review only
        if: ${{ github.event.inputs.mode == 'review' }}
        run: npx tsx scripts/review-dashboard.ts

      - name: Ambiguous-name adjudication only
        if: ${{ github.event.inputs.mode == 'ambiguous' }}
        run: npx tsx scripts/adjudicate-ambiguous.ts

      # ---- graph building, after the pipeline --------------------------------
      #
      # These populate the graph rather than the digest: who invests in whom,
      # who sits on which board, which companies hold a Singapore entity. None
      # of it surfaces a company on its own — it is what §8's warm paths are
      # built from once a company has already surfaced.
      #
      # So they run last, on the companies the pipeline just scored, and weekly
      # rather than daily because portfolio and team pages change slowly. Both
      # are idempotent: re-running matches rather than duplicating.
      #
      # Sunday 22:00, with the digest render — the same run whose scoring they
      # read. The hour is part of every condition because Monday 12:00 is the
      # send job: a day-only test would fire these there, against a graph no
      # pipeline had just refreshed, and skip the run they were written to
      # follow.
      - name: VC portfolio scraping
        if: >-
          ${{ github.event.inputs.mode == 'portfolios'
              || (github.event_name == 'schedule'
                  && steps.dow.outputs.hour == '22' && steps.dow.outputs.day == '7') }}
        run: npx tsx scripts/ingest-portfolios.ts

      - name: Fund team pages -> people + affiliations
        if: >-
          ${{ github.event_name == 'schedule'
              && steps.dow.outputs.hour == '22' && steps.dow.outputs.day == '7' }}
        run: npx tsx scripts/ingest-people.ts --funds

      # ACRA refreshes monthly, so a weekly pass is ample. It is a courtesy
      # service with no key, so the run is capped rather than sweeping every
      # portfolio company.
      - name: ACRA resolution -> sg_links
        if: >-
          ${{ github.event.inputs.mode == 'acra'
              || (github.event_name == 'schedule'
                  && steps.dow.outputs.hour == '22' && steps.dow.outputs.day == '7') }}
        run: npx tsx scripts/ingest-acra.ts --limit 300
